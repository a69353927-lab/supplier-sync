# Local WooCommerce demo store: ./setup-demo.sh
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
  wp:
    image: wordpress:latest
    ports: ["8089:80"]
    environment: &env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wp
      # application passwords over plain http need a "local" environment
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes: [wp:/var/www/html]
    depends_on: [db]
  cli:
    image: wordpress:cli
    profiles: [cli]
    user: "33:33"
    environment: *env
    volumes: [wp:/var/www/html]
    depends_on: [wp]
volumes:
  wp: {}
